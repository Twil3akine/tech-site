base_url = "https://rust.twil3akine.org"
title = "Twil3akine"
description = "プログラミングやツールなど、技術まわりの調べものをまとめる個人サイト。"
default_language = "ja"

# 検索インデックスは当面オフ（記事が増えたら有効化を検討）
build_search_index = false
generate_sitemap = true
compile_sass = false

[[taxonomies]]
name = "tags"

[markdown.highlighting]
style = "inline"
theme = "night-owl"

[extra]
route = ["std/vec.md", "std/string.md", "std/option.md", "std/result.md", "std/hashmap.md", "std/iterator.md", "std/file-io.md", "crates/axum-http-server.md"]
