base_url = "https://rust.twil3akine.org"
title = "Twil3akine"
description = "プログラミングやツールなど、技術まわりの調べものをまとめる個人サイト。"
default_language = "ja"

# Zola 組み込みの検索インデックスは日本語（ja）未対応でビルドエラーになるため無効。
# 検索用ドキュメントは templates/search-index.json で生成し、ブラウザ側で elasticlunr により索引化する。
build_search_index = false
generate_feeds = true
generate_sitemap = true
compile_sass = false

[[taxonomies]]
name = "tags"

[markdown.highlighting]
style = "inline"
theme = "night-owl"

[extra]
route = ["std/vec.md", "std/string.md", "std/option.md", "std/result.md", "std/hashmap.md", "std/slice.md", "std/iterator.md", "std/file-io.md", "crates/axum-http-server.md", "crates/serde-json.md"]

[[extra.tag_groups]]
parent = "Rust"
items = ["データ構造", "エラー処理", "所有権", "イテレータ", "入出力", "Web", "JSON"]

[[extra.tag_groups]]
parent = "ツール"
items = ["Git", "ターミナル"]

[[extra.tag_groups]]
parent = "Web"
items = ["HTTP"]
