{% extends "base.html" %}

{% block title %}{{ term.name }} | {{ config.title }}{% endblock title %}

{% block content %}
<div class="section-head">
  <h1 class="section-title">#{{ term.name }}</h1>
</div>
<ul class="stack">
  {% for page in term.pages %}
  <li class="stack-item"><a class="stack-title" href="{{ page.permalink | safe }}">{{ page.title }}</a></li>
  {% endfor %}
</ul>
{% endblock content %}
