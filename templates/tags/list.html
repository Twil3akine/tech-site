{% extends "base.html" %}

{% block title %}タグ | {{ config.title }}{% endblock title %}

{% block content %}
<div class="section-head">
  <h1 class="section-title">タグ</h1>
  <p class="category-desc">記事につけられたタグの一覧。</p>
</div>
<ul class="tag-rows">
  {% for term in terms %}
  <li><a href="{{ term.permalink | safe }}">#{{ term.name }}</a><span class="stack-meta">{{ term.pages | length }} 記事</span></li>
  {% endfor %}
</ul>
{% endblock content %}
