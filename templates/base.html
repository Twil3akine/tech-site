<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock title %}</title>
<meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
<link rel="icon" type="image/png" href="{{ get_url(path='favicon.png') }}">
<link rel="apple-touch-icon" href="{{ get_url(path='apple-touch-icon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ get_url(path='css/style.css') }}">
</head>
<body>
{% block header %}
<header class="site-header">
  <div class="header-inner container">
    <a class="brand" href="{{ get_url(path='/') }}">
      <img class="brand-icon" src="{{ get_url(path='img/icon.png') }}" alt="" width="36" height="36">
      <span class="brand-name">Twil3akine</span>
    </a>
    <button class="search-toggle" type="button" aria-label="検索を開く" aria-expanded="false" aria-controls="site-search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
    </button>
    <form id="site-search" class="site-search" action="https://www.google.com/search" method="get" role="search" onsubmit="this.q.value = 'site:rust.twil3akine.org ' + this.q.value;">
      <label class="search-shell">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
        <input class="site-search-input" type="search" name="q" placeholder="記事を検索" autocomplete="off" aria-label="サイト内検索">
        <kbd class="search-shortcut" aria-hidden="true">/</kbd>
      </label>
      <input type="hidden" name="as_sitesearch" value="rust.twil3akine.org">
      <button class="site-search-btn" type="submit" aria-label="検索">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg>
      </button>
    </form>
  </div>
</header>
{% endblock header %}
<main class="{% block main_class %}container{% endblock main_class %}">
{% block content %}{% endblock content %}
</main>
{% block footer %}
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-about">
      <img src="{{ get_url(path='img/icon.png') }}" alt="" width="44" height="44" class="footer-avatar">
      <div>
        <p class="footer-brand">Twil3akine</p>
        <p class="footer-intro">プログラミングやツールなど、技術まわりの調べものをまとめる個人サイト。</p>
      </div>
    </div>
    <nav class="footer-nav" aria-label="サイト内リンク">
      <a href="{{ get_url(path='/') }}">トップ</a>
      <a href="{{ get_url(path='/tags/') }}">タグ一覧</a>
      <a href="{{ get_url(path='/books/') }}">レビュー</a>
      <a href="{{ get_url(path='@/privacy.md') }}">プライバシーポリシー</a>
    </nav>
    <p class="footer-copy">© 2026 Twil3akine</p>
  </div>
</footer>
{% endblock footer %}
<script>
(function () {
  var header = document.querySelector(".site-header");
  var toggle = document.querySelector(".search-toggle");
  var form = document.querySelector(".site-search");
  var input = document.querySelector(".site-search-input");
  var mobile = window.matchMedia("(max-width: 640px)");

  function updateHeader() {
    if (header) header.classList.toggle("has-shadow", window.scrollY > 8);
  }
  updateHeader();
  window.addEventListener("scroll", updateHeader, { passive: true });

  function openSearch() {
    if (!form || !toggle) return;
    if (mobile.matches) {
      form.classList.add("is-open");
      toggle.setAttribute("aria-expanded", "true");
    }
    if (input) input.focus();
  }
  if (toggle) toggle.addEventListener("click", function () {
    if (!mobile.matches) return openSearch();
    var isOpen = form.classList.toggle("is-open");
    toggle.setAttribute("aria-expanded", String(isOpen));
    if (isOpen && input) input.focus();
  });
  document.addEventListener("keydown", function (event) {
    var target = event.target;
    var typing = target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName));
    if (event.key === "/" && !typing && !event.altKey && !event.ctrlKey && !event.metaKey) {
      event.preventDefault();
      openSearch();
    }
    if (event.key === "Escape" && mobile.matches && form && form.classList.contains("is-open")) {
      form.classList.remove("is-open");
      toggle.setAttribute("aria-expanded", "false");
      toggle.focus();
    }
  });

})();
</script>
<script>
(function () {
  function copyText(text, done) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () {});
      return;
    }
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    area.remove();
  }

  document.querySelectorAll("pre.giallo").forEach(function (pre) {
    if (pre.parentElement && pre.parentElement.classList.contains("codeblock")) return;
    var code = pre.querySelector("code");
    var lang = code ? code.getAttribute("data-lang") : "";
    if (lang === "shellsession") lang = "console";
    var wrap = document.createElement("div");
    wrap.className = "codeblock";
    pre.parentNode.insertBefore(wrap, pre);
    var head = document.createElement("div");
    head.className = "codeblock-head";
    var label = document.createElement("span");
    label.className = "codeblock-lang";
    label.textContent = lang && lang !== "plain" ? lang : "code";
    var button = document.createElement("button");
    button.className = "code-copy";
    button.type = "button";
    button.setAttribute("aria-label", "コードをコピー");
    button.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>';
    button.addEventListener("click", function () {
      var copySource = code ? code.cloneNode(true) : pre.cloneNode(true);
      copySource.querySelectorAll(".giallo-ln").forEach(function (lineNumber) { lineNumber.remove(); });
      copyText(copySource.innerText || copySource.textContent, function () {
        button.classList.add("is-copied");
        button.setAttribute("aria-label", "コピーしました");
        window.setTimeout(function () {
          button.classList.remove("is-copied");
          button.setAttribute("aria-label", "コードをコピー");
        }, 1400);
      });
    });
    head.appendChild(label);
    head.appendChild(button);
    wrap.appendChild(head);
    wrap.appendChild(pre);
  });
})();
</script>
<script>
(function () {
  var tocLinks = Array.prototype.slice.call(document.querySelectorAll(".toc-link"));
  var headings = tocLinks.map(function (link) {
    return document.getElementById(decodeURIComponent(link.hash.slice(1)));
  }).filter(Boolean);
  if (!("IntersectionObserver" in window) || !headings.length) return;
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      tocLinks.forEach(function (link) {
        var active = link.hash.slice(1) === entry.target.id;
        link.classList.toggle("is-active", active);
        if (active) link.setAttribute("aria-current", "location");
        else link.removeAttribute("aria-current");
      });
    });
  }, { rootMargin: "-18% 0px -72% 0px" });
  headings.forEach(function (heading) { observer.observe(heading); });
})();
</script>
</body>
</html>
